name: Release Automation

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: v1.0.${{ github.run_number }}
      PR_TITLE: ''
      JOKE: ''

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate version
        run: echo "VERSION=v1.0.${{ github.run_number }}" >> $GITHUB_ENV

      - name: Get PR title
        run: |
          echo "PR_TITLE=Manual push to main" >> $GITHUB_ENV

      - name: Get Chuck Norris Joke
        run: |
          JOKE=$(curl -s https://api.chucknorris.io/jokes/random | jq -r '.value')
          echo "JOKE<<EOF" >> $GITHUB_ENV
          echo "$JOKE" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Create Git Tag
        run: |
          git tag $VERSION
          git push origin $VERSION

      - name: Update README
        run: |
          cat <<EOF > release-info.md
          ## Latest Release Info

          - Version: $VERSION
          - PR Title: $PR_TITLE
          - Chuck Norris Joke: $JOKE
          EOF

          awk '
          BEGIN {p=1}
          /<!-- RELEASE-INFO-START -->/ {
            print;
            system("cat release-info.md");
            p=0;
            next
          }
          /<!-- RELEASE-INFO-END -->/ {
            p=1
          }
          p
          ' README.md > README.tmp

          mv README.tmp README.md

      - name: Commit README changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add README.md
          git commit -m "Update README with release info" || echo "No changes to commit"
          git push

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          body: |
            ## Latest Release Info

            Version: ${{ env.VERSION }}

            PR Title: ${{ env.PR_TITLE }}

            Chuck Norris Joke:
            ${{ env.JOKE }}